services:
  fefu-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fefu-bot
    restart: always
    depends_on:
      - mongodb
      - redis-server
    env_file:
      - ./FefuScheduleBot/.env
    volumes:
      - ./FefuScheduleBot/.env:/app/.env

  mongodb:
    image: mongo:latest
    container_name: fefu-bot-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  redis-server:
    image: redis:latest
    container_name: redis-server
    restart: always

volumes:
  mongo_data:
  redis_data: